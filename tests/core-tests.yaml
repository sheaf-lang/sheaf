- name: range
  test: (range 10 25 5)
  expected: "[10 15 20]"
- name: var
  test: (var [1 2 3])
  expected: "0.6666667"
- name: mse-loss
  test: (mse-loss [1.0 2.0 3.0] [1.1 1.9 3.1])
  expected: "0.009999997"
- name: mae-loss
  test: (mae-loss [1.0 2.0 3.0] [1.2 1.8 3.1])
  expected: "0.16666667"
- name: argmax
  test: (argmax [3 1 4 1 5])
  expected: "4"
- name: argmax
  test: (argmax [[1 5] [3 2]] :axis 1)
  expected: "[1 0]"
- name: argmin
  test: (argmin [3 1 4 1 5])
  expected: "1"
- name: argmin
  test: (argmin [[1 5] [3 2]] :axis 0)
  expected: "[0 1]"
- name: eye
  test: (eye 3)
  expected: "[[1. 0. 0.]\n [0. 1. 0.]\n [0. 0. 1.]]"
- name: eye
  test: (eye 2 4)
  expected: "[[1. 0. 0. 0.]\n [0. 1. 0. 0.]]"
- name: index-update
  test: (index-update [1 2 3 4 5] 2 99)
  expected: "[ 1.  2. 99.  4.  5.]"
- name: index-update
  test: (index-update [[1 2] [3 4]] 0 [10 20])
  expected: "[[10. 20.]\n [ 3.  4.]]"
- name: int
  test: (int 3.7)
  expected: "3"
- name: int
  test: (int [1. 2. 3.] :f32)
  expected: "[1 2 3]"
- name: float
  test: (float 42)
  expected: "42.0"
- name: float
  test: (float [1 2 3] :i32)
  expected: "[1. 2. 3.]"
- name: filter
  test: (filter (fn [x] (> x 2)) '[1 2 3 4 5])
  expected: "(3, 4, 5)"
- name: filter
  test: (filter (fn [x] (> x 10)) '[1 2 3])
  expected: "()"
- name: find
  test: (find (fn [x] (> x 3)) '[1 2 3 4 5])
  expected: "4"
- name: find
  test: (find (fn [x] (> x 10)) '[1 2 3])
  expected: None
- name: index-of
  test: (index-of '[10 20 30 40] 30)
  expected: "2"
- name: index-of
  test: (index-of '[10 20 30] 99)
  expected: "-1"
# --- quoted vectors with string literals (regression test: b8f5383) ---
- name: quoted vector strings
  test: (do '["hi" "hello" "world"])
  expected: "('hi', 'hello', 'world')"
- name: quoted vector mixed
  test: (do '[1 "two" 3])
  expected: "(1, 'two', 3)"
# --- io entropy (non-deterministic: test properties, not values) ---
- name: io entropy
  test: (>= (io "entropy") 0)
  expected: "True"
- name: io entropy
  test: (and (>= (io "entropy" 1) 0) (< (io "entropy" 1) 256))
  expected: "True"
- name: io entropy
  test: (not (= (io "entropy" 1) (io "entropy" 1)))
  expected: "True"
# --- f-string formatting (via str-call "format" — same engine as print) ---
- name: f-string format
  test: (str-call "format" "loss={:.4f} step={}" 0.0532 100)
  expected: "loss=0.0532 step=100"
- name: f-string padding
  test: (str-call "format" "[{:>3}] {:.2f}" 7 3.14159)
  expected: "[  7] 3.14"
