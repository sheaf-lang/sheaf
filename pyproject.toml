[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheaf-lang"
version = "1.2.0"
description = "A functional language for differentiable programming"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Damien Boureille"}
]
keywords = ["lisp", "jax", "neural-networks", "symbolic-ai", "deep-learning", "dsl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]

dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "safetensors>=0.4.0",
]

[project.scripts]
sheaf = "sheaf.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
]

examples = [
    "streamlit",
    "numpy",
    "matplotlib",
]

[project.urls]
Homepage = "https://sheaf-lang.org"
Documentation = "https://sheaf-lang.org"
Repository = "https://github.com/sheaf-lang/sheaf"
Issues = "https://github.com/sheaf-lang/sheaf/issues"

[tool.setuptools.packages.find]
include = ["sheaf*"]

[tool.setuptools.package-data]
sheaf = ["lib/*.shf"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools.exclude-package-data]
"*" = ["examples/**", "docs/**"]
