{% extends "base.html" %}

{% block extrahead %}
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Sheaf" />
{% if page and page.is_homepage %}
<meta property="og:title" content="Sheaf - A functional language for machine learning" />
{% elif page %}
<meta property="og:title" content="{{ page.title }} - Sheaf" />
{% endif %}
<meta
    property="og:description"
    content="Inspired by Clojure. Designed from the ground up for machine learning. Compiles to native GPU code."
/>
{% if page and page.canonical_url %}
<meta property="og:url" content="{{ page.canonical_url }}" />
{% endif %}
<meta property="og:image" content="{{ config.site_url }}images/sheaf-dark.png" />
<meta name="twitter:card" content="summary" />
{% endblock %}
