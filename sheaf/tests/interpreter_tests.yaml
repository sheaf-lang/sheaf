- name: grad-power-int
  test: (let [f (fn [x] (sum (** x 2))) [v g] ((value-and-grad f) [3.0])] g)
  expected: "[6.]"
- name: grad-power-float
  test: (let [f (fn [x] (sum (** x 2.0))) [v g] ((value-and-grad f) [3.0])] g)
  expected: "[6.]"
- name: random-uniform-grad
  test: (let [f (fn [x] (sum (where (> (random-uniform (random-key 0) (shape x)) -1.0) x 0.0))) [v g] ((value-and-grad f) [5.0 7.0])] [v g])
  expected: "[12.0, [1. 1.]]"
- name: f16-variadic-arithmetic-grad
  test: >
    (let [p (cast (tensor [2.0 2.0 2.0 2.0]) :f16)
          loss-fn (fn [x] (+ (mean (+ x x x))
                             (mean (* x x x))
                             (mean (- x (* 2.0 x) (* 3.0 x)))
                             (mean (/ x x x))))
          [loss grad] ((value-and-grad loss-fn) p)]
      [loss grad])
  expected: "[6.5, [2.6875 2.6875 2.6875 2.6875]]"
- name: f16-max-grad-uses-exact-equality
  test: >
    (let [p (cast (tensor [-0.75 -0.25 0.25 0.75]) :f16)
          [loss grad] ((value-and-grad (fn [x] (max x))) p)]
      [loss grad])
  expected: "[0.75, [0. 0. 0. 1.]]"
- name: f16-cross-entropy-grad
  test: >
    (let [targets (tensor [0 2])
          logits (cast (tensor [[1.0 0.0 -1.0] [0.5 -0.5 1.0]]) :f16)
          [loss grad] ((value-and-grad (fn [p] (cross-entropy-loss p targets))) logits)]
      [(> loss 0.5) (< loss 0.51) (> (sum (abs grad)) 0.0)])
  expected: "[true, true, true]"
- name: f16-clipped-sgd-step
  test: >
    (let [params {:W (cast (tensor [[1.0 -2.0] [0.5 -0.25]]) :f16)}
          loss-fn (fn [p] (mean (** (get p :W) 2.0)))
          [loss grads] ((value-and-grad loss-fn) params)
          clipped (clip-by-global-norm grads 1.0)
          updated (sgd-step params clipped (cast 1e-3 :f16))
          [new-loss _] ((value-and-grad loss-fn) updated)]
      (< new-loss loss))
  expected: "true"
- name: f16-matrix-vector-grad
  test: >
    (let [matrix (cast (tensor [[0.5 -1.0] [2.0 0.25]]) :f16)
          vector (cast (tensor [0.5 -1.0]) :f16)]
      ((value-and-grad (fn [p] (mean (@ p vector)))) matrix))
  expected: "[1.0,\n [[0.25 -0.5]\n  [0.25 -0.5]]]"
- name: f16-scan-grad
  test: >
    (let [values (cast (tensor [0.5 -1.0 2.0]) :f16)]
      ((value-and-grad
         (fn [p]
           (first (scan (fn [acc x]
                          (let [next (+ acc (* x x))] [next next]))
                        0.0 p))))
       values))
  expected: "[5.25, [ 1. -2.  4.]]"

# VAG on dict params (MLP-style)
- name: vag-mlp-loss
  test: >
    (let [p {:W (random-normal (random-key 0) '[4 2]) :b (zeros '[2])}
          x (random-normal (random-key 1) '[3 4])
          y (random-normal (random-key 2) '[3 2])
          [loss grad] ((value-and-grad (fn [p] (mean (** (- (+ (@ x (get p :W)) (get p :b)) y) 2)))) p)]
      loss)
  expected: "2.961008"
- name: vag-mlp-grad-shapes
  test: >
    (let [p {:W (random-normal (random-key 0) '[4 2]) :b (zeros '[2])}
          x (random-normal (random-key 1) '[3 4])
          y (random-normal (random-key 2) '[3 2])
          [loss grad] ((value-and-grad (fn [p] (mean (** (- (+ (@ x (get p :W)) (get p :b)) y) 2)))) p)]
      [(shape (get grad :W)) (shape (get grad :b))])
  expected: "[[4. 2.], [2.]]"
- name: vag-mlp-grad-nonzero
  test: >
    (let [p {:W (random-normal (random-key 0) '[4 2]) :b (zeros '[2])}
          x (random-normal (random-key 1) '[3 4])
          y (random-normal (random-key 2) '[3 2])
          [loss grad] ((value-and-grad (fn [p] (mean (** (- (+ (@ x (get p :W)) (get p :b)) y) 2)))) p)]
      (> (sum (abs (get grad :W))) 0.0))
  expected: "true"

# VAG with activation function (relu)
- name: vag-mlp-relu
  test: >
    (let [p {:W (random-normal (random-key 0) '[4 2]) :b (zeros '[2])}
          x (random-normal (random-key 1) '[3 4])
          y (random-normal (random-key 2) '[3 2])
          [loss grad] ((value-and-grad (fn [p] (mean (** (- (relu (+ (@ x (get p :W)) (get p :b))) y) 2)))) p)]
      (> (sum (abs (get grad :W))) 0.0))
  expected: "true"

