  expected: "0.05"
- name: linear-warmup-saturated
  test: (linear-warmup 0.1 20 10)
  expected: "0.1"
- name: inverse-sqrt-warmup-peak
  test: (inverse-sqrt-warmup 1.0 4 4)
  expected: "0.25"
- name: inverse-sqrt-warmup-decay
  test: (inverse-sqrt-warmup 1.0 10000 100)
  expected: "0.001"
- name: exponential-decay
  test: (exponential-decay 0.1 100 1000 0.96)
  expected: "0.09959262"
- name: step-decay
  test: (step-decay 0.1 25 10 0.5)
  expected: "0.025"
- name: cosine-decay-warmup
  test: (cosine-decay 0.1 5 10 100)
