[package]
name = "sheaf-compiler"
version = "2.3.0"
edition = "2024"
authors = ["Damien Boureille"]
license = "MIT"
description = "A functional language for differentiable programming"

# Binary CLI
[[bin]]
name = "sheaf"
path = "src/bin/sheaf/main.rs"

# Library - sheaf-compiler.so
[lib]
name = "sheaf_compiler"
crate-type = ["cdylib", "rlib"]

[dependencies]
bincode = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
getrandom = "0.2"
rustyline = "14"
unicode-width = "0.1"
nvml-wrapper = "0.10"
libc = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["accelerate"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ndarray = { version = "0.16" }

[package.metadata]
iree-version = "3.12.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
