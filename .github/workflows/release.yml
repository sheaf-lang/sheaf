name: Release
# Stable release pipeline.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_version:
        description: "Version stamp for a release pipeline test"
        type: string
        required: false
        default: ""

permissions:
  contents: write   # create the draft release

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      targets: '["linux-x86_64", "linux-aarch64", "macos-aarch64"]'
      build_version: ${{ inputs.build_version || '' }}

  examples:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: true
          repository-cache: true
          external-cache: true

      - name: Package examples
        run: ./mkexamples.sh

      - name: Upload examples
        uses: actions/upload-artifact@v5
        with:
          name: sheaf-examples
          path: sheaf-examples.tar.gz
          retention-days: 14

  # Run the examples the way a new user would, on a runner with no Bazel
  # cache and no ~/.cache/sheaf or ~/.sheaf state.
  examples-from-source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: false
          repository-cache: false
          external-cache: false
          disk-cache: false

      - name: Run examples
        run: |
          targets=$(bazel query 'kind("sheaf_example rule", //examples/...)')
          if [[ -z "$targets" ]]; then
            echo "no sheaf_example targets found" >&2
            exit 1
          fi
          for target in $targets; do
            echo "::group::bazel run $target"
            bazel run "$target"
            echo "::endgroup::"
          done

  examples-from-release:
    needs: [build, examples]
    runs-on: ubuntu-22.04
    steps:
      - name: Download binary and examples
        uses: actions/download-artifact@v5
        with:
          pattern: sheaf-{linux-x86_64,examples}
          merge-multiple: true

      - name: Unpack
        run: |
          mkdir -p bin
          tar xzf sheaf-linux-x86_64.tar.gz -C bin
          tar xzf sheaf-examples.tar.gz
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Run NanoGPT sampling
        working-directory: examples/nanogpt
        run: sheaf sample.shf

  release-draft:
    needs: [cuda-test, examples, examples-from-source, examples-from-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v5
        with:
          pattern: sheaf-*
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: sheaf-*.tar.gz
          body: |
            **DRAFT - CUDA validation passed.**

            This release was created automatically. Promote it manually after
            the remaining release checks are complete.

  cuda-test:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/cuda-test.yml
    with:
      # Test the exact tarball attached to the draft (draft URLs are not public).
      binary_artifact: "sheaf-linux-x86_64"
    secrets: inherit

  # NOTE: promotion to a public release is performed manually by a maintainer.
  # There is intentionally no automatic promote step here.
